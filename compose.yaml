services:
  postgres-n8n:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${N8N_DB_NAME}
      POSTGRES_USER: ${N8N_DB_USER}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      - n8n-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_DB_USER} -d ${N8N_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-reporting:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${REPORTING_DB_NAME}
      POSTGRES_USER: ${REPORTING_DB_USER}
      POSTGRES_PASSWORD: ${REPORTING_DB_PASSWORD}
    volumes:
      - reporting-postgres-data:/var/lib/postgresql/data
      - ./sql/reporting_schema.sql:/docker-entrypoint-initdb.d/01-reporting-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${REPORTING_DB_USER} -d ${REPORTING_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-pathways:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: ${PATHWAYS_DB_NAME}
      POSTGRES_USER: ${PATHWAYS_DB_USER}
      POSTGRES_PASSWORD: ${PATHWAYS_DB_PASSWORD}
    volumes:
      - pathways-postgres-data:/var/lib/postgresql/data
      - ./sql/reporting_schema.sql:/docker-entrypoint-initdb.d/01-reporting-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PATHWAYS_DB_USER} -d ${PATHWAYS_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "${N8N_PORT}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres-n8n
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME}
      DB_POSTGRESDB_USER: ${N8N_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: false
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${GENERIC_TIMEZONE}
      N8N_RUNNERS_TASK_TIMEOUT: 3600
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      postgres-n8n:
        condition: service_healthy
      postgres-reporting:
        condition: service_healthy

volumes:
  n8n-data:
  n8n-postgres-data:
  reporting-postgres-data:
  pathways-postgres-data: